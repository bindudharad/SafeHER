name: SafeHER CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Test & Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8 bandit

      - name: Run Flake8 Linter
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/ -ll -x backend/tests,backend/test_* || true

      - name: Run Pytest Test Suite
        env:
          SAFEHER_STORAGE_DIR: /tmp/safeher_storage
          SAFEHER_DB_PATH: /tmp/safeher_test.db
        run: |
          cd backend
          python -m pytest test_stage1_encryption.py test_stage2_evidence_analysis.py test_stage3_ai_models.py test_crypto_vault.py test_security_hardening.py test_stage6_survivor_safety.py test_stage7_production_hardening.py -v

  frontend-checks:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript Typecheck & Build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest Unit & Integration Tests
        run: |
          cd frontend
          npm test -- --run

  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate CycloneDX SBOM
        run: |
          python backend/scripts/generate_sbom.py --out sbom.json

      - name: Generate Syft CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: syft-sbom.cdx.json

      - name: Run Trivy Vulnerability & Secret Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Archive SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: safeher-cyclonedx-sbom
          path: |
            sbom.json
            syft-sbom.cdx.json
